# .github/workflows/ci.yml
name: CI
on: 
  push:
    branches:
      - emeline_b-gha
      - master
  pull_request:
      branches:
      - master
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint the code
        run: npm run lint
  test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Execute TU
        run: npm test -- --verbose
        env:
          ALLURE_RESULTS_DIR: allure-results
      - name: Generate an Allure report
        run: npm install allure-commandline
      - run: npx allure generate allure-results -o allure-report
      - name: Upload Allure report
        uses: actions/download-artifact@v5
        if: always()
        with:
          name: allure-report
          path: allure-report
      - name: Upload Allure coverage report
        uses: actions/download-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: coverage-report
      - name: Security Audit
        run: npm audit --production


