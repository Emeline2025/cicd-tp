# .github/workflows/ci.yml
name: CI
on: 
  pull_request:
      branches:
      - master
  push:
     branches:
      - master
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: npm ci
  lint:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Lint the code
        run: npm run lint
  test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Execute TU
        run: npm test

